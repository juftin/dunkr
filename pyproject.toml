[project]
name = "dunkr"
version = "0.5.0b0"
description = "the spiritual successor to dunk"
authors = [
    {name = "Justin Flannery", email = "justin.flannery@juftin.com"}
]
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["diff", "terminal", "side-by-side", "git", "cli", "dev-tools"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

requires-python = ">=3.11"
dependencies = [
    "unidiff>=0.7",
    "rich>=12.1.0",
    "textual>=0.80",
]

[project.scripts]
dunkr = "dunkr.cli:main"
dunkr-demo = "dunkr.demo:main"
dunkr-snapshots = "dunkr.snapshots:main"

[project.urls]
homepage = "https://github.com/juftin/dunkr"
repository = "https://github.com/juftin/dunkr"
issues = "https://github.com/juftin/dunkr/issues"
documentation = "https://github.com/juftin/dunkr/blob/main/README.md"

[dependency-groups]
dev = [
    "pytest",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/dunkr"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
