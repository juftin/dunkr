[project]
name = "dunkr"
version = "0.5.0b0"
description = "the spiritual successor to dunk"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "unidiff>=0.7",
  "rich>=12.1.0",
  "textual>=0.80"
]
authors = [
  { name = "Justin Flannery", email = "juftin@juftin.com" }
]
license = "MIT"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython"
]

[project.scripts]
dunkr = "dunkr.cli:main"
dunkr-demo = "dunkr.demo:main"
dunkr-snapshots = "dunkr.snapshots:main"

[project.urls]
Documentation = "https://juftin.github.io/dunkr"
Issues = "https://github.com/juftin/dunkr/issues"
Source = "https://github.com/juftin/dunkr"

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "mypy>=1,<2",
  "ruff~=0.12.10"
]
docs = [
  "mkdocs~=1.6.1",
  "mkdocs-material~=9.6.18",
  "markdown-callouts~=0.4.0",
  "markdown-exec~=1.11.0",
  "mkdocs-section-index~=0.3.10",
  "mkdocs-autorefs~=1.4.3",
  "mkdocstrings[python]~=0.30.0",
  "mkdocs-gen-files~=0.5.0",
  "mkdocs-literate-nav~=0.6.2",
  "pymdown-extensions~=10.16.1",
  "pygments<2.20"
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = [
  "-v",
  "--cov=src/dunkr",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
  "--junitxml=pytest.xml"
]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:"
]

[tool.coverage.run]
branch = true
omit = [
  "src/dunkr/__about__.py"
]
parallel = true

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
follow_imports = "silent"
ignore_missing_imports = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = [
  # Ignore checks for possible passwords
  "S105",
  "S106",
  "S107",
  # Ignore complexity
  "C901",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  # Boolean-typed positional argument in function definition
  "FBT001",
  # Boolean default positional argument in function definition
  "FBT002",
  # Allow boolean positional values in function calls, like `dict.get(... True)`
  "FBT003",
  # Exception must not use a string literal, assign to variable first
  "EM101",
  "EM102",
  # Subprocess calls for git operations
  "S603",
  "S607",
  # Print statements in CLI applications
  "T201",
  # Lazy imports
  "PLC0415",
  # Unused arguments in GUI/Textual handlers
  "ARG002",
  # Mutable class attributes in Textual widgets
  "RUF012",
  # Try-except pass blocks
  "S110",
  # Line length handled by formatter
  "E501",
  # Magic values
  "PLR2004"
]
select = [
  "A",  # flake8-builtins
  "ARG",  # flake8-unused-arguments
  "B",  # flake8-bugbear
  "C",  # mccabe
  "DTZ",  # flake8-datetimez
  "E",  # pycodestyle (Error)
  "EM",  # flake8-errmsg
  "F",  # Pyflakes
  "FBT",  # flake8-boolean-trap
  "I",  # isort
  "ICN",  # flake8-import-conventions
  "N",  # pep8-naming
  "PLC",  # Pylint (Convention message)
  "PLE",  # Pylint (Error message)
  "PLR",  # Pylint (Refactor message)
  "PLW",  # Pylint (Warning message)
  "Q",  # flake8-quotes
  "RUF",  # Ruff-specific rules
  "S",  # flake8-bandit
  "T",  # flake8-debugger (T10) and flake8-print (T20)
  "TID",  # flake8-tidy-imports
  "UP",  # pyupgrade
  "W",  # pycodestyle (Warning)
  "YTT"  # flake8-2020
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["dunkr"]

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, relative imports, and unused arguments for mocks
"tests/**/*" = ["PLR2004", "S101", "TID252", "ARG001", "ARG002", "ARG005", "S108", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
